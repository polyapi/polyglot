openapi: 3.0.0
info:
  title: Fake json placeholder spec
  version: 1.0.0
paths:
  /posts:
    post:
      operationId: createPost
      description: Creates a new post.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePost"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
components:
  schemas:
    Post:
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CreatePost:
      required:
        - name
      properties:
        name:
          type: string
